server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Mesma origem para o browser: a SPA chama /api e o nginx repassa a API.
  location /api/ {
    proxy_pass http://urlshortener.api:8080/api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Links curtos: o backend gera codigos de 7 [A-Za-z0-9] (ver
  # UrlShortenerService.Length); esses caminhos vao ao shim GET /{code} da API.
  location ~ "^/[A-Za-z0-9]{7}$" {
    proxy_pass http://urlshortener.api:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
